<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <title>AccuTrack</title>

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AccuTrack">

    <meta name="theme-color" content="#007AFF">

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- APP ROOT -->
    <div id="app">
        
        <!-- Top Bar -->
        <header class="topbar">
            <div>
                <h1>AccuTrack</h1>
                <p>Isotretinoin Tracker</p>
            </div>
        </header>

        <!-- Main Content -->
        <main id="view">
            <!-- JS render -->
        </main>

        <!-- Bottom Nav -->
        <nav class="tabbar">
            <button onclick="switchTab('dashboard')">🏠</button>
            <button onclick="switchTab('blood')">🩸</button>
            <button onclick="switchTab('history')">📜</button>
            <button onclick="switchTab('settings')">⚙️</button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
