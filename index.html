<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>A酸追蹤器</title>

<!-- PWA + iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A酸追蹤">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Theme -->
<meta name="theme-color" content="#0A84FF">

<!-- Icons -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">

<!-- CSS -->
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

<!-- HEADER -->
<header class="header">
  <h1>今日乾唔乾？🌵</h1>
  <p>Accutane Tracker</p>
</header>

<!-- DASHBOARD -->
<section id="tab-home" class="tab">

  <div class="card center">

    <div class="circle">
      <svg viewBox="0 0 120 120">
        <circle r="54" cx="60" cy="60" class="bg"></circle>
        <circle r="54" cx="60" cy="60" class="progress" id="ring"></circle>
      </svg>

      <div class="circle-text">
        <div id="percent">0%</div>
        <small>完成</small>
      </div>
    </div>

    <div class="stats">
      <div><span>已食</span><b id="taken">0</b></div>
      <div><span>目標</span><b id="target">0</b></div>
    </div>

  </div>

  <div class="card">
    <h3>Quick Log</h3>
    <div class="grid">
      <button onclick="logDose(10)">10</button>
      <button onclick="logDose(20)">20</button>
      <button onclick="logDose(30)">30</button>
      <button onclick="logDose(40)">40</button>
    </div>
  </div>

</section>

<!-- BLOOD -->
<section id="tab-blood" class="tab hidden card">
  <h3>Blood Test</h3>

  <input id="alt" placeholder="ALT">
  <input id="ast" placeholder="AST">
  <input id="chol" placeholder="Chol">
  <input id="tg" placeholder="TG">

  <button onclick="addBlood()">Save</button>

  <div id="bloodList"></div>
</section>

<!-- HISTORY -->
<section id="tab-history" class="tab hidden card">
  <h3>History</h3>
  <div id="history"></div>
</section>

<!-- SETTINGS -->
<section id="tab-settings" class="tab hidden card">
  <h3>Settings</h3>

  <input id="weight" type="number" placeholder="Weight (kg)">
  <select id="mult">
    <option value="120">120 mg/kg</option>
    <option value="150" selected>150 mg/kg</option>
  </select>

  <button onclick="saveSettings()">Save</button>

</section>

</div>

<!-- NAV -->
<nav>
  <button onclick="switchTab('home')">Home</button>
  <button onclick="switchTab('blood')">Blood</button>
  <button onclick="switchTab('history')">Log</button>
  <button onclick="switchTab('settings')">Set</button>
</nav>

<script src="app.js"></script>
</body>
</html>
