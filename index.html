<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>A酸追蹤器</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A酸追蹤">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

<!-- TOP -->
<header class="header">
  <div>
    <h1>今日乾唔乾？🌵</h1>
    <p>Accutane Tracker</p>
  </div>
</header>

<!-- PROGRESS -->
<section class="card center">
  <div class="circle">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="54" class="bg"/>
      <circle cx="60" cy="60" r="54" class="progress" id="progressRing"/>
    </svg>
    <div class="circle-text">
      <div id="percent">0%</div>
      <small>完成</small>
    </div>
  </div>

  <div class="stats">
    <div>
      <span>已食</span>
      <b id="taken">0</b>
    </div>
    <div>
      <span>目標</span>
      <b id="target">0</b>
    </div>
  </div>
</section>

<!-- QUICK ACTION -->
<section class="card">
  <h3>Quick Log</h3>
  <div class="grid">
    <button onclick="logDose(10)">10</button>
    <button onclick="logDose(20)">20</button>
    <button onclick="logDose(30)">30</button>
    <button onclick="logDose(40)">40</button>
  </div>
</section>

<!-- HISTORY -->
<section class="card">
  <h3>History</h3>
  <div id="history"></div>
</section>

<!-- NAV -->
<nav>
  <button onclick="tab('home')">Home</button>
  <button onclick="tab('history')">Log</button>
</nav>

</div>

<script src="app.js"></script>
</body>
</html>
