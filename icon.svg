<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5AC8FA"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Soft glow -->
  <circle cx="512" cy="420" r="320" fill="url(#glow)"/>

  <!-- Capsule -->
  <g transform="translate(0,10)">
    <rect x="312" y="380" width="400" height="180" rx="90" fill="#FFFFFF"/>

    <!-- split pill hint -->
    <path d="M512 380 L512 560" stroke="#E5E5EA" stroke-width="6"/>

    <!-- subtle medical cross (very light, not aggressive) -->
    <g opacity="0.25">
      <rect x="492" y="430" width="40" height="120" fill="#007AFF"/>
      <rect x="452" y="470" width="120" height="40" fill="#007AFF"/>
    </g>
  </g>

  <!-- Bottom highlight -->
  <circle cx="512" cy="720" r="180" fill="#FFFFFF" opacity="0.08"/>
</svg>
